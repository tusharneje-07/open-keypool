[project]
name = "open-keypool"
version = "0.1.0"
description = "Minimal Python library for pooling and rotating API keys to avoid HTTP 429 rate-limit errors."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Open KeyPool Contributors" },
]
keywords = ["api-keys", "rate-limiting", "key-rotation", "key-pool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pdoc>=15.0.0",
    "pytest>=8.0.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_keypool"]
